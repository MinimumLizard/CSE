name: daily

# 11:00 UTC = 16:30 Sri Lanka time, weekdays. The CSE trades 09:30-14:30 SLT and its data
# endpoints finish updating at about 14:57 SLT (docs/API_NOTES.md section 1).
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write     # commit data/
  pages: write        # deploy site/
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the pre-push rebase always works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: python -m pytest -q

      # Fails the job on any API or validation error. Nothing is written in that case,
      # and the deploy job below never runs, so the previous site stays up.
      - name: Fetch
        run: python -m cse.fetch

      # Commit the fetched data first, so a lab problem can never lose a day of data.
      - name: Commit data
        run: |
          git add data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"   # data/ commits rebase cleanly over code pushes
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Portfolio lab: corporate actions, estimates, model portfolios, live record.
      # Allowed to fail without blocking the terminal; the job is marked failed at the end.
      - name: Portfolio lab
        id: lab
        continue-on-error: true
        run: python -m cse.lab

      # Ownership graph re-valued at today's prices (no network; reports come from the weekly workflow).
      - name: Ownership
        id: ownership
        continue-on-error: true
        run: if [ -f data/raw/ownership/reports.csv ]; then python -m cse.ownership.analyse; fi

      - name: Build
        run: python -m cse.build

      - name: Commit record
        run: |
          git checkout -- data/ownership 2>/dev/null || true   # re-valued daily for the page; committed weekly only
          git add data
          if [ -d record ]; then git add record; fi   # record/ only exists from inception onwards
          git diff --cached --quiet || git commit -m "record: daily update $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: site

      - name: Fail the job if the lab or ownership step failed
        if: steps.lab.outcome == 'failure' || steps.ownership.outcome == 'failure'
        run: |
          echo "::error::cse.lab (${{ steps.lab.outcome }}) or cse.ownership.analyse (${{ steps.ownership.outcome }}) failed; the terminal was deployed with the last good output"
          exit 1

      # Keep a record of the failure (data/runs.csv only; no market data) so the next
      # successful build can show it. The page also warns by itself when its data goes stale.
      - name: Record failed run
        if: failure()
        run: |
          git add data/runs.csv || true
          git diff --cached --quiet || (git commit -m "data: record failed run $(date -u +%F)" && git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME")

  deploy:
    needs: update
    # Deploy whenever the site was built, even if only the lab step failed.
    if: ${{ always() && needs.update.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
