name: ownership

# Saturdays 02:00 UTC (07:30 Sri Lanka time). Collects any interim report filed since the last
# run (one per company; earlier ones stay in data/raw/ownership/ for tracking) and rebuilds the
# ownership graph. The daily workflow re-values it at each session's prices and deploys the page.
on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write     # commit data/

concurrency:
  group: daily        # shares the daily workflow's queue, so the two never push at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: python -m pytest -q

      - name: Collect reports
        run: python -m cse.ownership.collect

      - name: Analyse
        run: python -m cse.ownership.analyse

      - name: Commit
        run: |
          git add data
          git diff --cached --quiet || git commit -m "ownership: weekly update $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Record failed run
        if: failure()
        run: |
          git add data/runs.csv || true
          git diff --cached --quiet || (git commit -m "data: record failed ownership run $(date -u +%F)" && git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME")
